<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Block B — the site's block cursor with the B knocked out.
    The knockout is transparent, so the letter picks up whatever sits behind it.
    Fill adapts: #238636 holds up on a light tab bar, #7ee787 matches the site on a dark one.
  -->
  <style>
    .mark { fill: #238636; }
    @media (prefers-color-scheme: dark) { .mark { fill: #7ee787; } }
  </style>
  <mask id="cut">
    <rect x="1" y="1" width="30" height="30" rx="7" fill="#fff" />
    <g fill="none" stroke="#000" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 8.5V23.5" />
      <path d="M11 8.5H15.5L20.5 12.5L15.5 16H11" />
      <path d="M11 16H15.5L20.5 20L15.5 23.5H11" />
    </g>
  </mask>
  <rect class="mark" x="1" y="1" width="30" height="30" rx="7" mask="url(#cut)" />
</svg>
